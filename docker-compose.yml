name: leaklens

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leaklens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-leaklens}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leaklens} -d ${POSTGRES_DB:-leaklens}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - leaklens-internal
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY}
      INVITE_CODE: ${INVITE_CODE:-}
      DEMO_ACCESS_KEY: ${DEMO_ACCESS_KEY:-}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-guest1@gmail.com}
      DEMO_EXPIRES_AT: ${DEMO_EXPIRES_AT:-}
      POSTGRES_USER: ${POSTGRES_USER:-leaklens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-leaklens}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-5}
      SEARCH_RATE_LIMIT_PER_MINUTE: ${SEARCH_RATE_LIMIT_PER_MINUTE:-20}
      SNUSBASE_API_KEY: ${SNUSBASE_API_KEY}
      SNUSBASE_API_URL: ${SNUSBASE_API_URL:-https://api.snusbase.com}
      ENABLE_LEAKCHECK_PUBLIC: ${ENABLE_LEAKCHECK_PUBLIC:-true}
      ENABLE_EMAILREP: ${ENABLE_EMAILREP:-true}
      ENABLE_CERTSPOTTER: ${ENABLE_CERTSPOTTER:-true}
      EMAILREP_API_KEY: ${EMAILREP_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - leaklens-internal
      - leaklens-public
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M

networks:
  leaklens-internal:
    driver: bridge
    internal: true
  leaklens-public:
    driver: bridge

volumes:
  postgres_data:
